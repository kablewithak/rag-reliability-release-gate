[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-reliability-release-gate"
version = "0.1.0"
description = "Local-first RAG reliability, chaos-engineering, and load-testing release gate."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_reliability"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
